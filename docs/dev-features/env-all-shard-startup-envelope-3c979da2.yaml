id: ENV-3c979da2
title: Bound complete service startup on every normal E2E shard
title-ja: 全通常E2Eシャードのサービス起動全体を制限する
description: Extend the existing utils outer supervisor to every normal E2E matrix shard. The original at-most-two startup attempts share 360 seconds, clamped by the job-relative 1320-second checkpoint, with 10 seconds of termination grace. Keep the inner 180-second readiness and recovery gate and existing job limits. Supervise configuration preparation through fresh completion validation; reap only owned descendants on failure and hand ready services to the ordinary E2E follower on success. Bind fresh completion to the shard, execution and unique invocation nonce, and require successful structured evidence before any test command. Retain only typed phase, attempt, elapsed time, terminal outcome and safe process identifiers; discard raw startup stdout using an unlinked temporary file and omit exception text and process names. All shards verify diagnostic availability before normal failure artifact upload. External runner cancellation cannot guarantee upload. Isolated production-entry controls prove pre/post readiness stalls, retry success and deadline exhaustion, scoped cleanup, launch gating, freshness and synthetic secret exclusion; these do not establish the cause of the historical core-8 cancellation.
