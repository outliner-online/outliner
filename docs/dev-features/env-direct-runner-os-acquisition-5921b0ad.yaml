id: ENV-5921b0ad
title: Bounded strict direct-runner OS acquisition
title-ja: 直接実行CIのOSパッケージ取得を厳格な制限時間内に実行
description: Direct-runner E2E setup fails closed on package-source or required-package failure, retaining stage, source, exit and elapsed-time evidence within a 600-second aggregate OS/browser preparation budget. Local setup retains its degraded behavior.
category: environment
status: implemented
tests:
- scripts/tests/env-direct-runner-os-acquisition-5921b0ad.spec.ts
- scripts/tests/test_ubuntu_mirror_deadline.py
- scripts/tests/test_ubuntu_mirror_deadline_guards.py
notes: Real isolated Ubuntu APT/dpkg and browser regressions require Docker control. Image construction and fresh, unstarted container creation share the existing 900-second provisioning budget; acquisition clocks begin with container start, preserving all acquisition and test deadlines. Nonroot Firefox cases check the runner-owned cache and root acquisition termination through the actual tee pipeline during a stalled dependency download. Passing these regressions does not replace normal CI evidence at the final repair SHA. See docs/direct-runner-os-acquisition.md for the budget and evidence contract.
