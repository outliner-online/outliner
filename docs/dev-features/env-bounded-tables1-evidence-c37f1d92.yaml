description: Reuse the existing Linux E2E supervisor only for the primary tables-1 command after its observed outer-job timeout left no downloadable logs or artifact. Preserve project tables and shard 1/2, cases, assertions, retries and the 30-minute job limit. Bound the command to 20 minutes and 22 minutes from context initialization, reserving time for descendant termination and archive upload. Original failures remain nonzero; timeout, incomplete execution, missing reports and missing referenced attachments cannot pass. Retain successful and failed tables-1 evidence with required archive inputs. Give the subsequent resize verification separate output and HTML report paths so its cleanup cannot erase primary failed-attempt evidence. Other shards and existing new-2 output separation remain unchanged. Real Playwright subprocess regressions exercise the workflow's shard arguments, failure, timeout and retained attachments; this diagnostic change does not establish the unknown Tables timeout root cause.
