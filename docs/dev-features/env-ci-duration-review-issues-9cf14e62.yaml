id: ENV-9cf14e62
title: Daily CI duration review issues
title-ja: CI実行時間を毎日監視してレビュー用Issueを作成する
description: The daily CI monitor uses GitHub-native step timestamps and conclusions to admit verified current test jobs whose separated execution step reaches 600 seconds. Same-repository PRs against the default branch are supported. Setup-only, unknown, incomplete and retired evidence remains diagnostic. Admission is reported before the existing issue duplicate and closure checks. Server CI preserves its exact preparation in a named step before the unchanged Mocha selection; local npm test still prepares first.
category: environment
status: implemented
