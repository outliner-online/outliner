id: ENV-9cf14e62
title: Daily CI duration review issues
title-ja: CI実行時間を毎日監視してレビュー用Issueを作成する
description: The scheduled CI duration monitor reads completed GitHub Actions attempts, distinguishes runner work from queueing, and reconciles one review issue per configured workflow and logical job family only after two distinct successful default-branch runs of the same current job variant demonstrate at least ten minutes of native test work across multiple test files. Setup, incomplete, retired and unknown evidence stays diagnostic; shared setup timing never creates per-family issues. New complete English issue bodies are submitted with review-ready in a final operation. Existing reviewer edits and consumed readiness labels are preserved.
category: environment
status: implemented
components:
- .github/workflows/ci-duration-monitor.yml
- .github/ci-duration-monitor.json
- .github/ci-duration-issue.md
- scripts/ci_duration_monitor.py
- scripts/ci_duration_github.py
- scripts/ci_duration_policy.py
tests:
- scripts/tests/test_ci_duration_monitor.py
- scripts/tests/test_ci_duration_monitor_config.py
- scripts/tests/test_ci_duration_monitor_http.py
- scripts/tests/test_ci_duration_monitor_policy.py
