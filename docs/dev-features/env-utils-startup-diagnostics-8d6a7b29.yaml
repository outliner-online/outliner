id: ENV-8d6a7b29
title: Preserve utils startup diagnostics before the job deadline
title-ja: job 上限前に utils 起動の診断を保持する
description: Bound only the utils CI startup command to 360 seconds and the existing 22-minute context budget after an observed 30-minute outer job timeout prevented log upload. Keep the existing readiness checks, two startup attempts, test assertions and job deadline. Reuse the Linux supervisor with an explicit fresh startup completion marker, separate from the strict Playwright report validator. Successful startup hands its persistent services to E2E; failed or timed out startup terminates its descendants and retains full output and status. Nonzero failures, missing or stale completion, timeout and cleanup failure cannot pass. Require utils diagnostic archive inputs on success and failure. The historical blocking command remains unknown because its logs and artifact were unavailable; this change preserves evidence rather than claiming that root cause is fixed.
category: environment
status: implemented
