id: ENV-8d6a7b29
title: Preserve utils startup diagnostics before the job deadline
title-ja: job 上限前に utils 起動の診断を保持する
description: Introduced complete-startup supervision and explicit fresh completion evidence for utils in issue 5938. ENV-3c979da2 now applies that same envelope to every normal E2E shard and replaces raw startup output with allowlisted structured diagnostics. The existing readiness checks, two startup attempts, job deadline, fail-closed completion validation and owned-process cleanup remain in force. Diagnostic availability is checked separately from startup success. Historical missing artifacts do not establish which command blocked or why a runner was cancelled.
category: environment
status: implemented
