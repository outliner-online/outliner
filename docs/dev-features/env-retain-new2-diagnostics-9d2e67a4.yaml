id: ENV-9d2e67a4
title: Preserve new-2 diagnostics after a successful retry
title-ja: 再試行で成功した new-2 の診断証跡を保持する
description: Archive existing new-2 job logs, per-attempt JSON results and test attachments even when a flaky test succeeds on retry. Keep failure and Firefox retention, archive format, test execution, assertions, retries and time limits unchanged. This improves evidence retention without declaring the underlying flaky test fixed or recovering logs lost from a cancelled runner.
