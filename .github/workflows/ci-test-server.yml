name: Test Server

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  server-test-shard:
    name: server-test shard ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      packages: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env

      - name: Prepare server test runtime
        shell: bash
        run: |
          SKIP_SERVER_START=1 SKIP_PORT_WAIT=1 bash scripts/setup.sh
          test -x server/node_modules/.bin/mocha
          test -f server/node_modules/ts-node/esm.mjs
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Run server tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p job_logs
          SERVER_TEST_SHARD="${{ matrix.shard }}/2" \
            SERVER_TEST_RESULT_DIR="server-test-results/shard-${{ matrix.shard }}" \
            bash scripts/ci/run-server-test-shard.sh 2>&1 | tee -a "job_logs/server-test-${{ matrix.shard }}.log"
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server-test-results/shard-${{ matrix.shard }}/
            job_logs/
          retention-days: 2

  server-test:
    name: server-test
    if: always()
    needs: server-test-shard
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Download current shard results
        uses: actions/download-artifact@v8
        with:
          pattern: server-test-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded-server-tests
          merge-multiple: true

      - name: Verify complete server test result
        run: |
          bash scripts/ci/verify-server-test-job.sh \
            "${{ needs.server-test-shard.result }}" \
            downloaded-server-tests/server-test-results 2

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ Server Test Failed" >> "$GITHUB_STEP_SUMMARY"
          find downloaded-server-tests/job_logs -type f -print0 2>/dev/null \
            | xargs -0 grep -E -A1 -B0 "failing|FAIL|FAILED" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-logs
          path: downloaded-server-tests/job_logs/
          retention-days: 2

  project-directory-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      packages: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env

      - name: Run canonical project directory tests
        shell: bash
        run: |
          cd server
          TS_NODE_TRANSPILE_ONLY=1 \
            NODE_OPTIONS="--loader ts-node/esm --loader ./tests/loaders/pin-server-deps.mjs --no-warnings" \
            npx mocha tests/project-directory.test.ts tests/project-directory-provider.test.ts tests/project-directory-websocket.test.ts tests/cloud-production-entrypoint.test.ts --timeout 10000
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:58080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:59099
          FIREBASE_PROJECT_ID: outliner-d57b0
          GCLOUD_PROJECT: outliner-d57b0
