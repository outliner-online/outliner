name: CI Duration Monitor

on:
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect evidence without creating issues or adding labels'
        type: boolean
        default: true
        required: true
  pull_request:
    paths:
      - '.github/workflows/ci-duration-monitor.yml'
      - '.github/ci-duration-monitor.json'
      - '.github/ci-duration-issue.md'
      - 'scripts/ci_duration_monitor.py'
      - 'scripts/ci_duration_github.py'
      - 'scripts/tests/test_ci_duration_monitor*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-duration-monitor.yml'
      - '.github/ci-duration-monitor.json'
      - '.github/ci-duration-issue.md'
      - 'scripts/ci_duration_monitor.py'
      - 'scripts/ci_duration_github.py'
      - 'scripts/tests/test_ci_duration_monitor*.py'

permissions:
  contents: read

concurrency:
  group: ci-duration-monitor-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CI duration monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install monitor dependency
        run: python -m pip install loguru==0.7.3
      - name: Verify collection and issue reconciliation
        run: python -m unittest discover -s scripts/tests -p 'test_ci_duration_monitor*.py' -v

  monitor:
    name: Report slow CI jobs
    needs: verify
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install monitor dependency
        run: python -m pip install loguru==0.7.3
      - name: Collect completed runs and submit review issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
          SOURCE_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--config .github/ci-duration-monitor.json --source-ref "$SOURCE_REF")
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          python scripts/ci_duration_monitor.py "${args[@]}"
      - name: Retain monitor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-duration-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-duration-monitor-output/
          if-no-files-found: warn
          retention-days: 14
