name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-outliner-d57b0 # all refs deploy to the same project
  cancel-in-progress: false # finish one rollout before another can start

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Two measured serial recoveries took 103/111 seconds each; allow the full
    # 26-function rollout plus builds/verification, without an unbounded job.
    timeout-minutes: 90
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true # wipe workspace before fetch
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Firebase CLI
        run: npm install -g "firebase-tools@$(cat .firebase-tools-version)"

      - name: Install client dependencies and build
        run: |
          cd client
          npm ci
          npm run build:production

      - name: Install functions dependencies
        run: |
          cd functions
          npm ci

      - name: Install server dependencies and build
        run: |
          cd server
          npm ci
          npm run build

      - name: Create Sentry release (Client)
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT_CLIENT != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_CLIENT }}
        with:
          environment: production
          sourcemaps: './build'
          inject: false # v3 otherwise mutates sourcemaps by injecting debug IDs
          ignore_missing: true
          ignore_empty: true

      - name: Create Sentry release (Server)
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT_SERVER != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_SERVER }}
        with:
          environment: production
          sourcemaps: './server/dist'
          inject: false # preserve the v1 release behavior
          ignore_missing: true
          ignore_empty: true

      - name: Create Sentry release (Functions)
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT_FUNCTIONS != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_FUNCTIONS }}
        with:
          environment: production
          sourcemaps: './functions'
          inject: false # preserve the v1 release behavior
          ignore_missing: true
          ignore_empty: true


      - name: Setup GCP credentials
        if: github.actor != 'dependabot[bot]'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"
          # Reuse the existing deployment identity; no new IAM grant or token export.
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"

      - name: Lint functions
        run: |
          cd functions
          npm run lint

      - name: Verify Firebase CLI version
        run: |
          echo "Firebase CLI version:"
          scripts/firebase-cli.sh --version

      - name: Deploy to Firebase
        if: github.actor != 'dependabot[bot]'
        run: |
          python3 scripts/deploy-firebase-serial.py --project outliner-d57b0 \
            --receipt-dir "$RUNNER_TEMP/firebase-rollout-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Preserve rollout evidence
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: firebase-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          path: ${{ runner.temp }}/firebase-rollout-${{ github.run_id }}-${{ github.run_attempt }}
