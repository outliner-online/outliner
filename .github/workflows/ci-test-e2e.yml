name: Test E2E

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      cache_bust:
        description: >-
          Appended to the E2E dependency/tool/Playwright cache keys. Set to
          a throwaway value (e.g. a run number) to force a cold-cache run
          for A/B experiments without disturbing the persistent cache
          namespace normal runs rely on. Leave empty for a normal run.
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-runner-os-regression:
    name: Verify bounded direct-runner OS acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install ENV test dependencies
        run: npm ci --prefix scripts/tests --include=dev --no-audit --no-fund
      - name: Verify mirror-only control and owned-child cleanup
        run: python3 -m unittest discover -s scripts/tests -p 'test_ubuntu_mirror*.py' -v
      - name: Enable fixture layer cache
        uses: docker/setup-buildx-action@v4
      - name: Start shared fixture provisioning deadline
        shell: python
        run: |
          import os
          import time
          deadline = time.monotonic_ns() + 900_000_000_000
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DIRECT_RUNNER_OS_PROVISIONING_DEADLINE_NS={deadline}\n")
      - name: Build cached direct-runner fixture
        id: direct-runner-fixture
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/tests/fixtures/direct-runner-os/Dockerfile
          load: true
          tags: outliner-direct-os-regression:ci
          cache-from: type=gha,scope=direct-runner-os-fixture-v1
          cache-to: type=gha,mode=max,scope=direct-runner-os-fixture-v1
      - name: Exercise real isolated package acquisition
        shell: bash
        env:
          # The supported Docker action above authenticates cache import/export.
          # The ENV suite still creates one fresh container per scenario.
          DIRECT_RUNNER_OS_PREBUILT_IMAGE: outliner-direct-os-regression:ci
        run: |
          set -euo pipefail
          mkdir -p job_logs
          bash scripts/run-env-tests.sh --isolated env-direct-runner-os-acquisition-5921b0ad.spec.ts 2>&1 | tee job_logs/direct-runner-os-regression.log
      - name: Retain isolated acquisition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-runner-os-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: job_logs/direct-runner-os-regression.log
          retention-days: 2

  direct-runner-os-provisioning-failure:
    name: Verify fixture failure blocks scenario acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Enable fixture builder
        uses: docker/setup-buildx-action@v4
      - name: Exercise failing fixture provisioning
        id: fixture-build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: scripts/tests/fixtures/direct-runner-os/failure-control
          load: true
          tags: outliner-direct-os-regression:failure-control
      - name: Acquisition must stay blocked
        if: steps.fixture-build.outcome == 'success'
        run: |
          mkdir -p job_logs
          touch job_logs/unexpected-scenario-launch
          bash scripts/run-env-tests.sh --isolated env-direct-runner-os-acquisition-5921b0ad.spec.ts
      - name: Verify provisioning failure propagation
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.fixture-build.outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_OUTCOME" = failure
          test ! -e job_logs/unexpected-scenario-launch

  direct-runner-os-provisioning-deadline:
    name: Verify fixture build shares the provisioning deadline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install ENV test dependencies
        run: npm ci --prefix scripts/tests --include=dev --no-audit --no-fund
      - name: Enable fixture builder
        uses: docker/setup-buildx-action@v4
      - name: Start controlled shared provisioning deadline
        shell: python
        run: |
          import os
          import time
          deadline = time.monotonic_ns() + 1_000_000_000
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DIRECT_RUNNER_OS_PROVISIONING_DEADLINE_NS={deadline}\n")
      - name: Build deliberately delayed fixture
        uses: docker/build-push-action@v7
        with:
          context: scripts/tests/fixtures/direct-runner-os/deadline-control
          load: true
          tags: outliner-direct-os-regression:deadline-control
      - name: Reject acquisition after the shared deadline
        id: acquisition
        continue-on-error: true
        env:
          DIRECT_RUNNER_OS_PREBUILT_IMAGE: outliner-direct-os-regression:deadline-control
        run: |
          set -o pipefail
          mkdir -p job_logs
          bash scripts/run-env-tests.sh --isolated env-direct-runner-os-acquisition-5921b0ad.spec.ts \
            2>&1 | tee job_logs/deadline-control.log
      - name: Verify deadline failure blocked every scenario
        if: always()
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
        run: |
          set -euo pipefail
          test "$ACQUISITION_OUTCOME" = failure
          grep -F 'Fixture provisioning deadline exceeded' job_logs/deadline-control.log
          if grep -F ': elapsed=' job_logs/deadline-control.log; then
            echo 'scenario acquisition unexpectedly started after the provisioning deadline' >&2
            exit 1
          fi

  artifact-roundtrip:
    name: Verify E2E artifact round trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout artifact verifier
        uses: actions/checkout@v7

      - name: Create representative E2E evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-roundtrip/source
          printf '%s\n' '{"status":"passed","executed":2}' > artifact-roundtrip/source/execution.json
          printf '%s\n' 'firefox evidence retained' > artifact-roundtrip/source/runtime.log

          mkdir -p artifact-roundtrip/wrong
          printf '%s\n' '{"status":"wrong-artifact","executed":0}' > artifact-roundtrip/wrong/execution.json
          printf '%s\n' 'unrelated evidence' > artifact-roundtrip/wrong/runtime.log

      - name: Upload representative E2E evidence
        id: representative-upload
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-firefox-artifact-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifact-roundtrip/source/execution.json
            artifact-roundtrip/source/runtime.log
          archive: true
          retention-days: 1

      - name: Upload wrong-artifact control
        id: wrong-upload
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-firefox-artifact-roundtrip-wrong-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifact-roundtrip/wrong/execution.json
            artifact-roundtrip/wrong/runtime.log
          archive: true
          retention-days: 1

      - name: Record and validate artifact identities
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ steps.representative-upload.outputs.artifact-id }}
          WRONG_ARTIFACT_ID: ${{ steps.wrong-upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ARTIFACT_ID"
          test -n "$WRONG_ARTIFACT_ID"
          test "$EXPECTED_ARTIFACT_ID" != "$WRONG_ARTIFACT_ID"
          printf 'run=%s attempt=%s expected-artifact=%s wrong-artifact=%s sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$EXPECTED_ARTIFACT_ID" "$WRONG_ARTIFACT_ID" "$GITHUB_SHA"

      - name: Download representative E2E evidence
        id: representative-download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.representative-upload.outputs.artifact-id }}
          path: artifact-roundtrip/downloaded

      - name: Wait for exact artifact visibility
        if: steps.representative-download.outcome == 'failure'
        shell: bash
        run: sleep 10

      - name: Retry representative E2E evidence by exact identity
        if: steps.representative-download.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.representative-upload.outputs.artifact-id }}
          path: artifact-roundtrip/downloaded

      - name: Verify downloaded E2E evidence
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/verify-artifact-roundtrip.sh artifact-roundtrip/source artifact-roundtrip/downloaded

      - name: Reject an unavailable artifact
        id: unavailable-download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '0'
          path: artifact-roundtrip/unavailable

      - name: Confirm unavailable artifact is non-success
        if: always()
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.unavailable-download.outcome }}
        run: |
          set -euo pipefail
          test "$DOWNLOAD_OUTCOME" = failure

      - name: Download wrong-artifact control
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.wrong-upload.outputs.artifact-id }}
          path: artifact-roundtrip/wrong-downloaded

      - name: Confirm wrong, missing, and corrupted evidence are non-success
        shell: bash
        run: |
          set -euo pipefail
          if scripts/ci/verify-artifact-roundtrip.sh artifact-roundtrip/source artifact-roundtrip/wrong-downloaded; then
            echo 'wrong artifact unexpectedly passed verification' >&2
            exit 1
          fi

          cp -R artifact-roundtrip/downloaded artifact-roundtrip/missing-file
          rm artifact-roundtrip/missing-file/runtime.log
          if scripts/ci/verify-artifact-roundtrip.sh artifact-roundtrip/source artifact-roundtrip/missing-file; then
            echo 'missing file unexpectedly passed verification' >&2
            exit 1
          fi

          cp -R artifact-roundtrip/downloaded artifact-roundtrip/corrupted-file
          printf '%s\n' 'corrupted evidence' > artifact-roundtrip/corrupted-file/execution.json
          if scripts/ci/verify-artifact-roundtrip.sh artifact-roundtrip/source artifact-roundtrip/corrupted-file; then
            echo 'corrupted file unexpectedly passed verification' >&2
            exit 1
          fi

  selection-coverage:
    name: Guard Chromium and Firefox selection coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install collection guard dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p job_logs
          (
            npm ci --no-audit --no-fund
            npm ci --prefix client --no-audit --no-fund
            npm ci --prefix server --no-audit --no-fund
            npm ci --prefix scripts/tests --ignore-scripts --no-audit --no-fund
            ln -sfn ../client/node_modules shared/node_modules
          ) 2>&1 | tee job_logs/selection-coverage-setup.log
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Check actual collection and CI coverage
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/tests
          npx vitest run env-playwright-collects-every-spec-7d41ae62.spec.ts env-firefox-selection-coverage-78ad2b91.spec.ts env-firefox-ci-promotion-934d0f2a.spec.ts env-new3-shard-partition-8624c6a1.spec.ts env-new2-native-shards-8c3de7a2.spec.ts 2>&1 | tee ../../job_logs/selection-coverage.log
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p 'test_bounded_e2e*.py' -v 2>&1 | tee ../../job_logs/bounded-e2e-contract.log

      - name: Upload collection guard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-selection-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: job_logs/
          retention-days: 2

  # No serialized prepare job (issue #5169): each shard restores its own
  # dependency / Playwright / global-tool caches and builds server/dist
  # locally, instead of waiting on a single upstream job. Real GitHub
  # Actions A/B measurements (see the PR description for #5169) showed
  # this wins on total wall-clock in both the common warm-cache case
  # (~6m38s vs ~10m3s, first Playwright start ~1m15s vs ~3m9s) and a
  # forced cold-cache case (~9m41s vs ~11m2s), with no shard failures
  # from the 20-way concurrent cache-miss "stampede". The one real
  # trade-off: cold-cache aggregate runner-minutes are higher (~98 vs
  # ~70 job-minutes) because every shard repeats `npm ci` / the
  # Playwright install independently instead of once; this only bites
  # on a lockfile change (rare) and wall-clock latency is what matters
  # for shipping PRs faster, so it's accepted. `actions/cache` restores
  # are safe to run concurrently across shards: on a cache miss,
  # whichever shard finishes first just gets to populate the cache for
  # later runs; there is no shared mutable state between shards.
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      E2E_BROWSER: ${{ startsWith(matrix.project, 'firefox-') && 'firefox' || 'chromium' }}
      E2E_PROJECT: ${{ startsWith(matrix.project, 'new-2-') && 'new-2' || matrix.project }}
      E2E_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_EXECUTION_REPORT: ${{ github.workspace }}/job_logs/e2e-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}.execution.json
      E2E_EXPECTED_COLLECTION: ${{ github.workspace }}/job_logs/expected-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}.json
      E2E_BROWSER_RUNTIME_REPORT: ${{ github.workspace }}/job_logs/browser-runtime-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}.json

    strategy:
      fail-fast: false
      matrix:
        project: [basic, core-1, core-2, core-3, core-4, core-4b, core-5, core-6, core-7, core-8, new-1, new-2-1, new-2-2, new-3a, new-3b, new-4, new-5, auth, utils, server, yjs, tables-1, tables-2, schedule, onprem, firefox-selection-core-4, firefox-selection-core-4b, firefox-selection-new, firefox-selection-basic]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Initialize execution evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p job_logs
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('job_logs/execution-context.json', JSON.stringify({
            browserEngine: process.env.E2E_BROWSER,
            browserVersion: null,
            playwrightVersion: JSON.parse(fs.readFileSync('client/package-lock.json', 'utf8')).packages['node_modules/@playwright/test'].version,
            playwrightVersionSource: 'client/package-lock.json',
            project: process.env.E2E_PROJECT,
            ciShard: '${{ matrix.project }}',
            executionId: process.env.E2E_EXECUTION_ID,
            commit: process.env.GITHUB_SHA,
            status: 'setup',
            testExecution: process.env.E2E_BROWSER === 'firefox'
              ? { status: 'not-started', collected: null, executed: 0, attempts: 0 }
              : undefined,
            startedAt: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE

      - name: Setup E2E dependencies
        id: setup
        uses: ./.github/actions/setup-e2e-deps
        with:
          browser: ${{ env.E2E_BROWSER }}
          cache-key-suffix: ${{ github.event.inputs.cache_bust && format('-{0}', github.event.inputs.cache_bust) || '' }}

      - name: Verify Firefox execution results and failure evidence
        id: firefox-execution-contract
        if: matrix.project == 'firefox-selection-basic'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/tests --ignore-scripts --no-audit --no-fund 2>&1 | tee job_logs/firefox-execution-contract-setup.log
          (
            cd scripts/tests
            npx vitest run env-firefox-execution-results-64ab7e91.spec.ts env-firefox-ci-entrypoint-a31f98d4.spec.ts
          ) 2>&1 | tee job_logs/firefox-execution-contract.log

      - name: Build server
        id: build
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            npm run build
            test -s dist/server/src/index.js
          ) 2>&1 | tee job_logs/setup-server-build.log

      - name: Run E2E-specific startup (services + readiness)
        id: startup
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-e2e-startup.sh
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Run E2E tests (${{ matrix.project }})
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p job_logs
          python3 scripts/ci/verify-startup-evidence.py --require-success
          echo 'startup_verified=true' >> "$GITHUB_OUTPUT"
          project="${{ matrix.project }}"
          if [ "$project" = "onprem" ]; then
            scripts/test-onprem-client.sh 2>&1 | tee -a "job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log"
          elif [ "$E2E_BROWSER" = "firefox" ]; then
            node scripts/run-firefox-selection.mjs --project="$project" \
              2>&1 | tee "job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log"
          else
            cd client
            if [[ "$project" =~ ^new-2-([12])$ ]]; then
              shard="${BASH_REMATCH[1]}/2"
              PLAYWRIGHT_HTML_OPEN=never python3 ../scripts/ci/run-bounded-e2e.py \
                --context=../job_logs/execution-context.json \
                --status="../job_logs/${project}-command-status.json" \
                --log="../job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log" \
                --report="${PLAYWRIGHT_JSON_OUTPUT_NAME}" \
                --timeout-seconds=1200 --job-budget-seconds=1320 --grace-seconds=10 \
                -- npm run github:test:e2e -- --project=new-2 --shard="$shard" --reporter=line,list,json,html
            elif [[ "$project" =~ ^new-3[ab]$ ]]; then
              # Bound the command before the job deadline so timeout evidence
              # can upload. Line output identifies started, unfinished cases.
              PLAYWRIGHT_HTML_OPEN=never python3 ../scripts/ci/run-bounded-e2e.py \
                --context=../job_logs/execution-context.json \
                --status="../job_logs/${project}-command-status.json" \
                --log="../job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log" \
                --report="${PLAYWRIGHT_JSON_OUTPUT_NAME}" \
                --timeout-seconds=1200 --job-budget-seconds=1320 --grace-seconds=10 \
                -- npm run github:test:e2e -- --project="$project" --reporter=line,json,html
            elif [ "$project" = "tables-1" ]; then
              python3 ../scripts/ci/run-bounded-e2e.py \
                --context=../job_logs/execution-context.json \
                --status=../job_logs/tables-1-command-status.json \
                --log="../job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log" \
                --report="${PLAYWRIGHT_JSON_OUTPUT_NAME}" \
                --timeout-seconds=1200 --job-budget-seconds=1320 --grace-seconds=10 \
                -- npm run github:test:e2e -- --project=tables --shard=1/2
            elif [[ "$project" =~ ^tables-([12])$ ]]; then
              npm run github:test:e2e -- --project=tables --shard="${BASH_REMATCH[1]}/2" 2>&1 | tee -a "../job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log"
            else
              npm run github:test:e2e -- --project="$project" 2>&1 | tee -a "../job_logs/e2e-${E2E_BROWSER}-${project}-${E2E_EXECUTION_ID}.log"
            fi
          fi
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../job_logs/e2e-${{ env.E2E_BROWSER }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          E2E_ATTACH_BROWSER_CONSOLE: '1'
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Verify retry-free Yjs offline synchronization without Tinylicious
        if: matrix.project == 'yjs'
        shell: bash
        run: |
          set -euo pipefail
          assert_no_tinylicious() {
            bash scripts/ci/assert-no-tinylicious.sh
          }
          assert_no_tinylicious
          scripts/test.sh client/e2e/yjs/offline-sync-merge.spec.ts -- \
            --project=yjs --retries=0 \
            > >(tee job_logs/yjs-offline-no-tinylicious.log) 2>&1 &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            if ! assert_no_tinylicious; then
              echo "Unexpected Tinylicious process or legacy listener during Yjs test" >&2
              kill "$test_pid" 2>/dev/null || true
              wait "$test_pid" || true
              exit 1
            fi
            sleep 1
          done
          wait "$test_pid"
          assert_no_tinylicious
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          SKIP_AUTO_SETUP: '1'
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Record retry-free Grid clipboard verification
        if: matrix.project == 'new-2-1'
        shell: bash
        run: |
          set -euo pipefail
          # Playwright clears output/report directories at the start of each run.
          # Keep the primary suite's failed-attempt attachments intact.
          PLAYWRIGHT_HTML_OUTPUT_DIR=../job_logs/grid-clipboard-repeat-10-report \
            scripts/test.sh client/e2e/new/clp-copy-paste-component-blocks-4584c0de.spec.ts -- \
            --project=new-2 \
            --output=../job_logs/grid-clipboard-repeat-10-results \
            --grep='copy and paste creates a second live view of the same Grid' \
            --repeat-each=10 \
            --retries=0 \
            2>&1 | tee job_logs/grid-clipboard-repeat-10.log
          PLAYWRIGHT_HTML_OUTPUT_DIR=../job_logs/grid-clipboard-full-spec-report \
            scripts/test.sh client/e2e/new/clp-copy-paste-component-blocks-4584c0de.spec.ts -- \
            --project=new-2 \
            --output=../job_logs/grid-clipboard-full-spec-results \
            --retries=0 \
            2>&1 | tee job_logs/grid-clipboard-full-spec.log
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          SKIP_AUTO_SETUP: '1'
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Record retry-free Grid resize wheel verification
        if: matrix.project == 'tables-1'
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_HTML_OUTPUT_DIR=../job_logs/grid-resize-wheel-report \
            scripts/test.sh client/e2e/tables/grd-grid-width-drag-bounds-5c1d8e2a.spec.ts -- \
            --project=tables \
            --output=../job_logs/grid-resize-wheel-results \
            --retries=0 \
            2>&1 | tee job_logs/grid-resize-wheel-retry-free.log
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          SKIP_AUTO_SETUP: '1'
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ E2E Test Failed (${{ matrix.project }})" >> $GITHUB_STEP_SUMMARY
          if [ -f "job_logs/e2e-${E2E_BROWSER}-${{ matrix.project }}-${E2E_EXECUTION_ID}.log" ]; then
            grep -E -A1 -B0 "FAIL|FAILED" "job_logs/e2e-${E2E_BROWSER}-${{ matrix.project }}-${E2E_EXECUTION_ID}.log" >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Verify startup evidence
        id: startup_evidence
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/verify-startup-evidence.py --stage-upload

      - name: Record setup and execution status
        if: always()
        shell: bash
        env:
          E2E_JOB_STATUS: ${{ job.status }}
          E2E_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p job_logs
          node <<'NODE' 2>&1 | tee job_logs/execution-status.log
          const fs = require('node:fs');
          const path = require('node:path');
          const file = 'job_logs/execution-context.json';
          const record = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          const runtimeFile = process.env.E2E_BROWSER_RUNTIME_REPORT;
          if (runtimeFile && fs.existsSync(runtimeFile)) {
            record.browserRuntimeProbe = JSON.parse(fs.readFileSync(runtimeFile, 'utf8'));
            record.browserVersion = record.browserRuntimeProbe.browserVersion;
            record.playwrightVersion = record.browserRuntimeProbe.playwrightVersion;
            record.playwrightVersionSource = 'Firefox runtime probe';
          }
          record.status = process.env.E2E_JOB_STATUS;
          record.steps = JSON.parse(process.env.E2E_STEP_OUTCOMES);
          if (process.env.E2E_BROWSER === 'firefox') {
            const executionFile = path.resolve('client', process.env.E2E_EXECUTION_REPORT);
            if (fs.existsSync(executionFile)) {
              const execution = JSON.parse(fs.readFileSync(executionFile, 'utf8'));
              record.testExecution = {
                status: execution.status,
                ...execution.counts,
                report: path.relative(process.cwd(), executionFile),
              };
            } else if (record.steps.tests && record.steps.tests.outcome !== 'skipped') {
              record.testExecution = { status: 'unobserved', collected: null, executed: null, attempts: null };
            }
          }
          record.finishedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE

      - name: Upload Logs & Artifacts
        # Retain Playwright command evidence, reports and attachments. Raw service
        # files may still contain startup-origin bytes after readiness succeeds;
        # omit them entirely rather than infer a safe byte boundary or mutate logs.
        if: steps.tests.outputs.startup_verified == 'true' && (failure() || startsWith(matrix.project, 'firefox-') || startsWith(matrix.project, 'new-2-') || startsWith(matrix.project, 'new-3') || matrix.project == 'tables-1' || matrix.project == 'utils')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ env.E2E_BROWSER }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            job_logs/
            client/test-results/
            client/playwright-report/
          archive: true
          if-no-files-found: ${{ (startsWith(matrix.project, 'new-2-') || startsWith(matrix.project, 'new-3') || matrix.project == 'tables-1' || matrix.project == 'utils') && 'error' || 'warn' }}
          retention-days: 2

      - name: Upload safe startup diagnostics
        # Services may write secrets directly to logs/ or firebase-debug.log.
        # Before verified E2E entry, retain only the verifier's structured snapshot.
        if: always() && steps.tests.outputs.startup_verified != 'true' && steps.startup_evidence.outputs.upload_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ env.E2E_BROWSER }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.startup_evidence.outputs.upload_path }}
          archive: true
          if-no-files-found: error
          retention-days: 2

  new-3-complete:
    # Preserve the original consumer-facing check name. Every E2E matrix row,
    # including both new-3 halves, must succeed before this check can pass.
    name: e2e-test (new-3)
    needs: e2e-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete E2E matrix
        env:
          E2E_RESULT: ${{ needs.e2e-test.result }}
        run: test "$E2E_RESULT" = success

  new-2-complete:
    name: e2e-test (new-2)
    needs: [e2e-test, selection-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete E2E matrix and collection
        env:
          E2E_RESULT: ${{ needs.e2e-test.result }}
          COLLECTION_RESULT: ${{ needs.selection-coverage.result }}
        run: test "$E2E_RESULT" = success && test "$COLLECTION_RESULT" = success
