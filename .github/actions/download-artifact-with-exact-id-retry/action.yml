name: Download artifact with exact-ID retry
description: Download an artifact by ID, retrying into an isolated directory after a lookup failure.

inputs:
  primary-artifact-id:
    description: Artifact ID used by the first exact-ID lookup.
    required: true
  retry-artifact-id:
    description: Artifact ID used by the retry. Production callers pass the same finalized ID.
    required: true
  destination-root:
    description: Root for the isolated primary and retry destinations.
    required: true
  retry-delay-seconds:
    description: Delay before retrying a failed lookup.
    required: false
    default: '10'

outputs:
  downloaded-directory:
    description: Isolated directory populated by the successful attempt.
    value: ${{ steps.select-directory.outputs.downloaded-directory }}

runs:
  using: composite
  steps:
    - name: Download primary exact artifact identity
      id: primary
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.primary-artifact-id }}
        path: ${{ inputs.destination-root }}/primary

    - name: Wait for exact artifact visibility
      if: steps.primary.outcome == 'failure'
      shell: bash
      env:
        RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
      run: sleep "$RETRY_DELAY_SECONDS"

    - name: Retry exact artifact identity
      if: steps.primary.outcome == 'failure'
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.retry-artifact-id }}
        path: ${{ inputs.destination-root }}/retry

    - name: Select successful isolated destination
      id: select-directory
      shell: bash
      env:
        DESTINATION_ROOT: ${{ inputs.destination-root }}
        PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
      run: |
        set -euo pipefail
        if [ "$PRIMARY_OUTCOME" = success ]; then
          printf 'downloaded-directory=%s/primary\n' "$DESTINATION_ROOT" >> "$GITHUB_OUTPUT"
        else
          printf 'downloaded-directory=%s/retry\n' "$DESTINATION_ROOT" >> "$GITHUB_OUTPUT"
        fi
